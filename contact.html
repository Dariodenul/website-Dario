<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <!-- resetten van browsers -->
  <link rel="stylesheet" href="css/reset.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap CSS icons: https://icons.getbootstrap.com/#usage -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- JavaScript: Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer>
    </script>
  <!-- eigen geschreven css voor jouw html-bestand -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>

<body>

  <header class="py-3 border-bottom bg-white">
    <nav class="navbar navbar-expand-md navbar-light container">
      <a class="navbar-brand" href="contact.html">
        <img src="assets/logo.png" alt="Logo Dario" height="75">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="portfolio.html" class="nav-link">Portfolio</a></li>
          <li class="nav-item"><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>
  <div id="map" style="height: 300px;"></div>

  <main class="container my-5">

    <section class="row align-items-start mb-5">
      <div class="col-md-4 text-center mb-4 mb-md-0">
        <img src="assets/server-2160321_1280.jpg" alt="sfeerbeeld-3" width="300" height="400"
          class="img-fluid rounded border">
      </div>
      <div class="col-md-8">
        <h1>Contact</h1>
        <form action="#" method="POST">
          <div class="mb-3">
            <label for="naam" class="form-label"><strong>Jouw naam</strong></label>
            <input type="text" class="form-control" id="naam" name="naam" placeholder="Vul je naam in" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label"><strong>Jouw email-adres</strong></label>
            <input type="email" class="form-control" id="email" name="email" placeholder="voorbeeld@mail.com" required>
          </div>

          <div class="mb-3">
            <label for="vraag" class="form-label"><strong>Stel jouw vraag:</strong></label>
            <textarea class="form-control" id="vraag" name="vraag" rows="4" placeholder="Stel hier je vraag..."
              required></textarea>
          </div>

          <button type="submit" class="btn btn-success">Indienen</button>
        </form>

      </div>

    </section>

  </main>

  <footer class="footer">
    <div class="container text-center">
      <p class="fw-bold mb-3">Contactgegevens</p>
      <p class="mb-1">Tel: <strong>+32478189891</strong></p>
      <p class="mb-1">Email: <strong>denul.dario@hotmail.com</strong></p>
      <p class="mb-1">Schoolmail: <strong>s16755@ap.student.be</strong></p>
      <p class="mb-1">Locatie: <strong>Antwerpen, België</strong></p>
      <p class="mb-1">© <span id="year"></span> <span class="footer-name">Dario De Nul</span></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script>
    var map = L.map('map').setView([51.1766, 4.3651], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    L.marker([51.1766, 4.3651]).addTo(map)
      .bindPopup('Hoboken, België')
      .openPopup();
  </script>
</body>

</html>
